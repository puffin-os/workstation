version: '3'

tasks:
  summary:
    cmds:
      - task: ':keys'
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - '{{.CONTAINER}} -w /work/workstation {{.BUILDER}} mkosi --profile=dev {{.KEYS}} summary'

  flatpaks:lock:
    cmds:
      - task: ':builder'
      - mkdir -p '{{.ROOT}}/out'
      - '{{.CONTAINER}} {{.BUILDER}} /work/dev/flatpak-seed.sh lock'

  flatpaks:build:
    internal: true
    sources:
      - flatpaks.apps
      - flatpaks.lock
      - '{{.ROOT}}/dev/flatpak-seed.sh'
    generates:
      - '{{.ROOT}}/out/puffin-workstation-flatpaks-x86-64.tar.zst'
    cmds:
      - task: ':builder'
      - mkdir -p '{{.ROOT}}/out'
      - '{{.CONTAINER}} {{.BUILDER}} /work/dev/flatpak-seed.sh build'

  build:
    cmds:
      - task: ':keys'
      - task: flatpaks:build
      - mkdir -p '{{.ROOT}}/out' '{{.ROOT}}/.cache/mkosi' '{{.ROOT}}/.cache/packages'
      - '{{.CONTAINER}} -w /work/workstation {{.BUILDER}} mkosi --profile=dev {{.KEYS}} -f build'
      - >-
        '{{.ROOT}}/dev/install-flatpak-seed.sh'
        '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
        '{{.ROOT}}/out/puffin-workstation-flatpaks-x86-64.tar.zst'

  ensure-built:
    internal: true
    status:
      - test -f '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
    cmds:
      - task: build

  run:
    cmds:
      - task: ensure-built
      - PUFFIN_FLAVOR=workstation PUFFIN_GRAPHICS=1 '{{.ROOT}}/dev/qemu.sh'

  check:
    cmds:
      - task: ensure-built
      - >-
        '{{.ROOT}}/dev/check-desktop-image.sh'
        '{{.ROOT}}/out/puffin-workstation-x86-64.raw'
        '{{.ROOT}}/out/puffin-workstation-x86-64.manifest'
        puffin-workstation
      - PUFFIN_FLAVOR=workstation '{{.ROOT}}/dev/qemu.sh' --check

  reset:
    cmds:
      - rm -f -- '{{.ROOT}}/state/puffin-workstation.qcow2' '{{.ROOT}}/state/OVMF_VARS-workstation.fd'